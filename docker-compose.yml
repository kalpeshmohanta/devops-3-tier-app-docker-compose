version: '3.8'

services:

  database:
    build:
      context: ./assignment/database
      dockerfile: postgres.Dockerfile
    env_file:
      - ./assignment/database/.env
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data  # database storage path using Docker volume


  backend:
    build:
      context: ./assignment/backend
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - database
    networks:
      - app-network


  frontend:
    build:
      context: ./assignment/frontend
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
